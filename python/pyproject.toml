[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellaflow"
version = "0.1.0"
description = "Python SDK for Cellaflow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "grpcio-tools>=1.60.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.black]
line-length = 88
force-exclude = ".*_pb2.*\\.py"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = [
    ".*_pb2\\.py$",
    ".*_pb2_grpc\\.py$"
]
