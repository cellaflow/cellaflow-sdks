[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellaflow"
version = "0.1.2"
description = "Python SDK for Cellaflow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "msgpack>=1.0.7",
    "rfc8785>=0.1.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
license = "Apache-2.0 OR MIT"

[project.urls]
Homepage = "https://www.cellaflow.com"
Documentation = "https://www.cellaflow.com"
Repository = "https://github.com/cellaflow/cellaflow-sdks"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "grpcio-tools>=1.60.0",
    "mypy-protobuf>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q --cov=cellaflow --cov-report=term-missing"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src/cellaflow"]
omit = [
    "src/cellaflow/v1/*",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*.pyi",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
force-exclude = ".*_pb2.*\\.py"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = [
    ".*_pb2\\.py$",
    ".*_pb2_grpc\\.py$",
    ".*\\.pyi$"
]
