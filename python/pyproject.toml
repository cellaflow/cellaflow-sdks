[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellaflow"
version = "0.5.0"
description = "Python SDK for Cellaflow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.60.0",
    # Floor must match the gencode version the pinned grpcio-tools emits --
    # the generated stubs assert it at import, so a lower runtime does not fail
    # at first use, it fails at `import cellaflow`. See the dev pin below.
    "protobuf>=5.29.0",
    "msgpack>=1.0.7",
    "rfc8785>=0.1.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
license = "Apache-2.0 OR MIT"

[project.urls]
Homepage = "https://www.cellaflow.com"
Documentation = "https://www.cellaflow.com"
Repository = "https://github.com/cellaflow/cellaflow-sdks"

[project.optional-dependencies]
langgraph = [
    "langgraph-checkpoint>=2.0.0",
    "langgraph>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    # Pinned, not floored. protoc bakes its own version into every generated
    # module as a runtime assertion, so whichever grpcio-tools happens to
    # resolve silently sets the protobuf floor for everyone installing us.
    # 1.71.0 emits gencode 5.29.0, which is inside the range CrewAI allows
    # (<6.0, via opentelemetry-proto) and AutoGen requires (~=5.29.3). A newer
    # toolchain emitted 7.35.1 and made us uninstallable alongside both.
    "grpcio-tools==1.71.0",
    # Pinned for the same reason as grpcio-tools: its own bundled
    # extensions.proto carries a gencode guard, and recent releases are built
    # against protobuf 6.x, which makes protoc refuse to run the plugin under
    # the 5.x runtime the pin above targets. 3.6.0 carries no guard.
    "mypy-protobuf==3.6.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q --cov=cellaflow --cov-report=term-missing"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src/cellaflow"]
omit = [
    "src/cellaflow/v1/*",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*.pyi",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
force-exclude = ".*_pb2.*\\.py"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = [
    ".*_pb2\\.py$",
    ".*_pb2_grpc\\.py$",
    ".*\\.pyi$"
]
