syntax = "proto3";

package cellaflow.v1;

import "cellaflow/v1/common.proto";

// ============================================================================
// Enums & Shared Types
// ============================================================================

// Key construction scope used by SDKs during key auto-derivation.
// The SDK uses this to prefix the opaque idempotency_key before sending it
// to the engine. The engine never parses this — it is purely an SDK concern.
enum IdempotencyScope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_SESSION_WIDE = 1;  // Shared across all agents in the session (Default)
  SCOPE_AGENT_PRIVATE = 2; // Isolated to the executing agent
  SCOPE_STEP_LOCAL = 3;    // Isolated to the specific superstep / node
}

enum CacheStatus {
  CACHE_STATUS_UNSPECIFIED = 0;
  CACHE_STATUS_HIT = 1;         // Found in cache (or completed by in-flight worker)
  CACHE_STATUS_ACQUIRED = 2;    // Miss & lease granted: caller should execute tool
  CACHE_STATUS_IN_PROGRESS = 3; // Miss & currently running by another worker
}

enum RenewFailureReason {
  RENEW_FAILURE_REASON_UNSPECIFIED = 0;
  RENEW_FAILURE_REASON_EXPIRED = 1;     // Lease timed out before renewal arrived
  RENEW_FAILURE_REASON_SUPERSEDED = 2;  // A newer worker acquired a higher fencing token
  RENEW_FAILURE_REASON_NOT_FOUND = 3;   // Key does not exist or was deleted
  RENEW_FAILURE_REASON_COMPLETED = 4;   // Step was already committed by another worker

  // CEL-106: the lease hit its maximum total lifetime and was taken back.
  //
  // Deliberately distinct from EXPIRED. Expired means the holder stopped
  // renewing; this means it kept renewing and the engine reclaimed anyway. The
  // holder is still running, may already have performed its side effect, and
  // must be told the engine took the lease rather than that it lost track of
  // time.
  RENEW_FAILURE_REASON_MAX_LIFETIME_EXCEEDED = 5;
}

enum IdempotencyCommitStatus {
  IDEMPOTENCY_COMMIT_UNSPECIFIED = 0;
  IDEMPOTENCY_COMMIT_COMMITTED = 1;
  IDEMPOTENCY_COMMIT_ALREADY_COMMITTED = 2;    // Idempotent retry of the commit call itself
  IDEMPOTENCY_COMMIT_STALE_LEASE_REJECTED = 3; // Fencing token invalid — caller was fenced out
}

// ============================================================================
// RPC Messages
// ============================================================================

message CheckCacheRequest {
  string agent_id = 1;              // Validated against caller principal; NOT parsed into key
  string idempotency_key = 2;       // Fully formed, opaque composite key
  optional uint64 wait_timeout_ms = 3;
  optional uint64 lease_ttl_ms = 4; // Crash-detection window; defaults to engine config

  // CEL-98: the session this check is being made on behalf of.
  //
  // The idempotency key is opaque to the engine and deliberately stays that way,
  // so the session cannot be recovered from it. Without this field the engine
  // cannot tell the caller where its session currently sits, which is what a
  // caller needs after a cache hit — see `current_sequence` on the response.
  //
  // Optional for wire compatibility: clients predating this field still work,
  // they simply receive no `current_sequence` back.
  optional string session_id = 5;

  // CEL-103: the graph position this caller intends to write to.
  //
  // The engine already knows which session is asking (field 5) and where that
  // session has committed to (`latest_committed_sequence`). This supplies the
  // one missing input: where the caller is going. With all three, a lease that
  // would authorise a side effect at an already-committed position can be
  // refused *before* the side effect happens, rather than rejected at commit
  // time after the money has moved.
  //
  // Note this is the caller's *intended* position, not the response's
  // `current_sequence`, which reports where the session already sits.
  //
  // Optional for wire compatibility: clients that omit it keep the previous
  // behaviour and are still granted leases. Sending 0 is an error rather than
  // a synonym for "unset" -- sequences are 1-based, so 0 is never a position a
  // caller could legitimately intend to write.
  optional uint64 sequence = 6;
}

message CheckCacheResponse {
  CacheStatus status = 1;
  optional StepResult cached_result = 2;
  optional uint64 fencing_token = 3;         // Present iff ACQUIRED
  optional uint64 lease_expires_at_ms = 4;   // Present iff ACQUIRED or IN_PROGRESS
  optional uint64 heartbeat_interval_ms = 5; // Present iff ACQUIRED — caller MUST renew
  optional uint64 retry_after_ms = 6;        // Present iff IN_PROGRESS and wait exhausted
  optional string current_holder_id = 7;     // Present iff IN_PROGRESS (for distributed tracing)

  // CEL-98: the requested session's highest committed sequence, or 0 if it has
  // none. Present whenever `session_id` was supplied — on every status, not only
  // on HIT.
  //
  // A caller that takes a HIT returns without committing, so its local counter
  // advances while the session's does not, and its next commit fails the
  // ordering check one step after the real cause. This lets it re-align.
  //
  // Returned on ACQUIRED and IN_PROGRESS too because it costs one seek on a call
  // that already performs a storage transaction, and it lets a caller about to
  // execute confirm it is where it thinks it is.
  optional uint64 current_sequence = 8;
}

message RenewLeaseRequest {
  string agent_id = 1;
  string idempotency_key = 2;
  uint64 fencing_token = 3;
  uint64 extend_ms = 4;
}

message RenewLeaseResponse {
  bool renewed = 1;                              // False => lease was reclaimed/completed; stop execution
  optional uint64 new_expires_at_ms = 2;         // Present iff renewed = true
  optional RenewFailureReason failure_reason = 3;// Present iff renewed = false
}

message ReleaseLeaseRequest {
  string agent_id = 1;
  string idempotency_key = 2;
  uint64 fencing_token = 3;
  optional string reason = 4;                    // e.g. "RATE_LIMITED_429", "CANCELLED", "TOOL_ERROR"
}

message ReleaseLeaseResponse {
  bool released = 1;
}
