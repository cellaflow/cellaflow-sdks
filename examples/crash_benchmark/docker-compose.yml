# Postgres holds the LangGraph checkpoints for every guard. CellaFlow holds the
# leases for the cellaflow guard only. Every guard runs against exactly this.
services:
  postgres:
    image: postgres:16-alpine
    # max_connections defaults to 100. At high writer counts `lock` and `claim`
    # each hold a second connection alongside PostgresSaver, so they would hit
    # that ceiling before they hit contention -- and `cellaflow`, which holds no
    # Postgres connection of its own, would appear to win a race that was
    # actually decided by `FATAL: sorry, too many clients already`. Raised so the
    # pool is not the variable. The real cost of holding a connection across a
    # side effect is measured separately, in "What the lock costs, measured".
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports: ["55434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  cellaflow:
    image: ghcr.io/cellaflow/cellaflow:latest
    environment:
      CELLAFLOW_HOST: "::"
      CELLAFLOW_DB_PATH: /data/cellaflow
    ports: ["50051:50051", "9090:9090"]
