name: Publish Python SDK to PyPI

on:
  release:
    types: [published] # Triggers automatically when you publish a new GitHub Release
  # Allows you to run this workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish Python SDK to PyPI
    runs-on: ubuntu-latest
    
    # Required for PyPI Trusted Publishing
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      # The proto toolchain must come from the dev extra, not be installed
      # loose here. protoc writes its own version into every generated module
      # as a runtime assertion, so an unpinned `--upgrade grpcio-tools` sets the
      # package's effective protobuf floor at publish time -- and CI, which does
      # install the dev extra, would never see it. That divergence is how 0.5.0
      # shipped stubs demanding protobuf 7.35.1 while declaring 4.25.0.
      - name: Install build tools & dependencies
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Generate Protobufs
        working-directory: ./python
        run: |
          chmod +x scripts/generate_protos.sh
          ./scripts/generate_protos.sh

      - name: Build package
        working-directory: ./python
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
