name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-ci:
    name: Python SDK Tests & Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "genbadge[coverage]"

      - name: Generate Protobufs
        working-directory: ./python
        run: |
          chmod +x scripts/generate_protos.sh
          ./scripts/generate_protos.sh

      - name: Run Linters & Type Checks
        working-directory: ./python
        run: |
          flake8 src tests
          mypy src tests

      - name: Run Tests with Coverage
        working-directory: ./python
        # pytest is piped through tee, and a step with no `shell:` runs `bash -e`
        # without pipefail, so the step would report tee's status rather than
        # pytest's and a failing suite would pass. pipefail makes the pipe carry
        # pytest's status; it is captured rather than exited on, so the summary is
        # still written, and the step exits with it at the end.
        #
        # --cov-fail-under: coverage of the Python package must not drop below 90%.
        run: |
          set -o pipefail
          mkdir -p ../badges
          status=0
          pytest --cov=cellaflow --cov-fail-under=90 --cov-report=term --cov-report=xml:../badges/coverage.xml | tee pytest_output.txt || status=$?
          echo "### 📊 Python SDK Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -A 30 "coverage: platform" pytest_output.txt >> $GITHUB_STEP_SUMMARY || cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $status

      # The lowest grpcio and protobuf the package declares, read from
      # pyproject.toml so the check cannot drift from it. The generated stubs
      # check the runtime at import, so a floor below what they were generated
      # for installs cleanly and then fails at `import cellaflow`.
      - name: Test against the lowest supported grpcio and protobuf
        working-directory: ./python
        run: |
          grpcio=$(sed -n 's/^ *"grpcio>=\([0-9.]*\)",.*/\1/p' pyproject.toml)
          protobuf=$(sed -n 's/^ *"protobuf>=\([0-9.]*\)",.*/\1/p' pyproject.toml)
          test -n "$grpcio" && test -n "$protobuf"
          python -m pip install "grpcio==$grpcio" "protobuf==$protobuf"
          python -c "import grpc, google.protobuf, cellaflow; print('grpcio', grpc.__version__, 'protobuf', google.protobuf.__version__)"
          pytest -q -p no:cacheprovider --no-cov

      - name: Generate Coverage Badge
        working-directory: ./python
        run: |
          genbadge coverage -i ../badges/coverage.xml -o ../badges/coverage.svg

      - name: Commit & Push Coverage Badge (on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          if git diff --staged --quiet; then
            echo "Coverage badge has not changed."
          else
            git commit -m "ci: update coverage badge [skip ci]"
            git push
          fi

  typescript-ci:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Builds and tests on Node 18. The compiler itself needs a newer 18 than
      # the package does, so the floor is tested in its own step below. The
      # publish job builds with 24.x.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: ./typescript
        run: npm ci

      # Builds with tsc, which is also the type check, then runs the tests under
      # tests/*.test.mjs. Those need no engine; tests/smoke.mjs does and is not run.
      - name: Build and test
        working-directory: ./typescript
        run: npm test

      # Exactly the lowest Node the package supports (engines: >=18.14.1, which
      # Connect 2 requires), running what the step above built, so a dependency
      # that needs a newer Node fails here rather than for users on it.
      - name: Set up the lowest supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.14.1"

      - name: Test on the lowest supported Node.js
        working-directory: ./typescript
        run: |
          node --version
          node --test tests/*.test.mjs

  integration:
    name: Integration Tests (real engine)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Pinned, so a test fails because the SDK changed, not because the engine
    # moved under it. Raise it when an SDK change needs a newer engine. Engine
    # version tags are written once from 0.3.0 on; `:0.2.0` was rewritten by
    # later merges, so it no longer named one engine.
    env:
      ENGINE_IMAGE: ghcr.io/cellaflow/cellaflow:0.3.0
      CELLAFLOW_TARGET: localhost:50051
      # A second engine that requires a token, for the API key tests. The token
      # guards a throwaway container on the runner, nothing else.
      CELLAFLOW_AUTH_TARGET: localhost:50052
      CELLAFLOW_AUTH_TEST_KEY: integration-test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start the engines
        run: |
          docker run -d --name engine -p 50051:50051 \
            -e CELLAFLOW_ALLOW_UNAUTHENTICATED=true "$ENGINE_IMAGE"
          docker run -d --name engine-auth -p 50052:50051 \
            -e CELLAFLOW_API_KEY="$CELLAFLOW_AUTH_TEST_KEY" "$ENGINE_IMAGE"
          # An open port only means Docker's proxy is listening. The image's own
          # healthcheck polls /health/ready, so wait for that, and stop at once
          # with the engine's log if it exits instead.
          for name in engine engine-auth; do
            for i in $(seq 1 60); do
              state=$(docker inspect -f '{{.State.Status}} {{.State.Health.Status}}' "$name")
              case "$state" in
                "running healthy") break ;;
                exited*|dead*) docker logs "$name"; exit 1 ;;
              esac
              if [ "$i" = 60 ]; then docker logs "$name"; exit 1; fi
              sleep 2
            done
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies and generate protobufs
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          chmod +x scripts/generate_protos.sh
          ./scripts/generate_protos.sh

      - name: Python integration tests
        working-directory: ./python
        run: pytest --no-cov tests/integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: TypeScript integration tests
        working-directory: ./typescript
        run: |
          npm ci
          npm run test:integration

      - name: Engine logs
        if: failure()
        run: |
          # Each on its own, so one missing container does not hide the other's log.
          docker logs engine || true
          docker logs engine-auth || true
