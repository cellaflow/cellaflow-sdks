name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-ci:
    name: Python SDK Tests & Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "genbadge[coverage]"

      - name: Generate Protobufs
        working-directory: ./python
        run: |
          chmod +x scripts/generate_protos.sh
          ./scripts/generate_protos.sh

      - name: Run Linters & Type Checks
        working-directory: ./python
        run: |
          flake8 src tests
          mypy src tests

      - name: Run Tests with Coverage
        working-directory: ./python
        run: |
          mkdir -p ../badges
          pytest --cov=cellaflow --cov-report=term --cov-report=xml:../badges/coverage.xml | tee pytest_output.txt
          echo "### 📊 Python SDK Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -A 30 "coverage: platform" pytest_output.txt >> $GITHUB_STEP_SUMMARY || cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate Coverage Badge
        working-directory: ./python
        run: |
          genbadge coverage -i ../badges/coverage.xml -o ../badges/coverage.svg

      - name: Commit & Push Coverage Badge (on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          if git diff --staged --quiet; then
            echo "Coverage badge has not changed."
          else
            git commit -m "ci: update coverage badge [skip ci]"
            git push
          fi

  typescript-ci:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The lowest Node the package supports (engines: >=18), and the version the
      # publish job builds with.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: ./typescript
        run: npm ci

      # Builds with tsc, which is also the type check, then runs the tests under
      # tests/*.test.mjs. Those need no engine; tests/smoke.mjs does and is not run.
      - name: Build and test
        working-directory: ./typescript
        run: npm test
