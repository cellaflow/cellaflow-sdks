name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-ci:
    name: Python SDK Tests & Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "genbadge[coverage]"

      - name: Generate Protobufs
        working-directory: ./python
        run: |
          chmod +x scripts/generate_protos.sh
          ./scripts/generate_protos.sh

      - name: Run Linters & Type Checks
        working-directory: ./python
        run: |
          flake8 src tests
          mypy src tests

      - name: Run Tests with Coverage
        working-directory: ./python
        run: |
          mkdir -p ../badges
          pytest --cov=cellaflow --cov-report=term --cov-report=xml:../badges/coverage.xml | tee pytest_output.txt
          echo "### 📊 Python SDK Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -A 30 "coverage: platform" pytest_output.txt >> $GITHUB_STEP_SUMMARY || cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate Coverage Badge
        working-directory: ./python
        run: |
          genbadge coverage -i ../badges/coverage.xml -o ../badges/coverage.svg

      - name: Commit & Push Coverage Badge (on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          if git diff --staged --quiet; then
            echo "Coverage badge has not changed."
          else
            git commit -m "ci: update coverage badge [skip ci]"
            git push
          fi
