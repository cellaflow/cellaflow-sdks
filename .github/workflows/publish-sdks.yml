name: Publish SDKs to Registries

on:
  release:
    types: [published] # Triggers automatically when you publish a new GitHub Release
  # Allows you to run this workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  publish-python:
    name: Build and publish Python SDK to PyPI
    runs-on: ubuntu-latest
    
    # Required for PyPI Trusted Publishing
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      # The proto toolchain must come from the dev extra, not be installed
      # loose here. protoc writes its own version into every generated module
      # as a runtime assertion, so an unpinned `--upgrade grpcio-tools` sets the
      # package's effective protobuf floor at publish time -- and CI, which does
      # install the dev extra, would never see it. That divergence is how 0.5.0
      # shipped stubs demanding protobuf 7.35.1 while declaring 4.25.0.
      - name: Install build tools & dependencies
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Generate Protobufs
        working-directory: ./python
        run: |
          chmod +x scripts/generate_protos.sh
          ./scripts/generate_protos.sh

      - name: Build package
        working-directory: ./python
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          # One run publishes both packages, so re-running it after the other one
          # failed must not fail here on a version PyPI already has.
          skip-existing: true

  publish-typescript:
    name: Build and publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    
    # Required for npm Trusted Publishing / Provenance
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      # Trusted publishing exchanges this job's OIDC token for npm credentials, and
      # only npm 11.5.1 and later can do that. Node 24.5 and later bundle it; Node 18
      # and 22 bundle npm 10, which publishes with no credentials at all, and npm
      # answers that with a misleading 404. The check below fails clearly instead.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm can use trusted publishing
        run: |
          v=$(npm --version)
          echo "npm $v"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::npm $v cannot use trusted publishing; it needs 11.5.1 or later."
            exit 1
          fi
          
      - name: Install dependencies
        working-directory: ./typescript
        run: npm install

      # The prepublishOnly script in package.json will automatically run
      # `npm run build` (tsc) right before publishing.
      - name: Publish package to npm
        working-directory: ./typescript
        run: npm publish --provenance --access public
