// The two messages the SDK reads from an engine's error details, taken from
// google/rpc/error_details.proto in https://github.com/googleapis/googleapis
// (Copyright Google LLC, Apache License 2.0). Only these messages and only
// the fields the SDK reads, under their upstream package, names and field
// numbers, so they decode what the engine sends. Fields left out are skipped
// when decoding.
//
// Not part of the engine's protocol, which is proto/cellaflow at the root of
// the repository and mirrors the engine, and not exported by the package.
// Generated into src/google/rpc/error_details_pb.ts by running, in
// typescript/:
//
//   npx buf generate proto --template '{"version":"v2","plugins":[{"local":"protoc-gen-es","out":"src","opt":["target=ts","import_extension=.js"]}]}'

syntax = "proto3";

package google.rpc;

// Why an error happened, as a reason within a domain.
message ErrorInfo {
  string reason = 1;
  string domain = 2;
  map<string, string> metadata = 3;
}

// Which quota a refused request ran into.
message QuotaFailure {
  message Violation {
    string subject = 1;
  }

  repeated Violation violations = 1;
}
